# iTransformer — best model in every task of the paper (tables 3-1, 3-2, 4-1).
#
# Hyper-parameters are the paper's: d_model = 32, d_ff = 32, e_layers = 2,
# n_heads = 8, dropout = 0.1, lr = 1e-4, patience = 3.
#
# NOTE: iTransformer standardises each input window inside forward() on top of the
# dataset-level scaler. That is recorded as
# `uses_internal_normalisation: true` in the run's metrics.json because it changes
# how SHAP values must be read.
model:
  name: iTransformer
  params:
    d_model: 32
    d_ff: 32
    e_layers: 2
    n_heads: 8
    dropout: 0.1
    factor: 1
    activation: gelu
    embed: timeF
    freq: h

training:
  learning_rate: 1.0e-4
  patience: 3
