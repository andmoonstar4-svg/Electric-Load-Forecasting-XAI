# Random Forest baseline (paper S2.2).
# Direct multi-step: the forest regresses all 24 future hours at once from a
# flattened (168 x 7) input window.
model:
  name: RandomForest
  params:
    n_estimators: 300
    max_depth: null
    min_samples_leaf: 1
    n_jobs: -1
    random_state: 2021
    oob_score: true
