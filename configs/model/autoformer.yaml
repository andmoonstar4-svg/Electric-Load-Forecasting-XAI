# Autoformer — over-smooths in this task (paper S2.3, S5.2, S5.3).
model:
  name: Autoformer
  params:
    d_model: 32
    d_ff: 32
    e_layers: 2
    d_layers: 1
    n_heads: 8
    dropout: 0.1
    factor: 1
    moving_avg: 25
    activation: gelu
    embed: timeF
    freq: h

training:
  learning_rate: 1.0e-4
  patience: 3
